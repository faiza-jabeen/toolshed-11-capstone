services:
  api:
    build: ./server
    ports: ["4000:4000"]
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/toolshed.db
      CORS_ORIGIN: http://localhost:8080
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?generate one with openssl rand -hex 48}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?generate one with openssl rand -hex 48}
    volumes: ["toolshed-data:/data"]

  client:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  toolshed-data:

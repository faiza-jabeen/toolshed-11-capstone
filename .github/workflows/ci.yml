name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm test

  client:
    name: Client tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # A bundle that quietly doubles is a performance regression nobody notices
      # until Lighthouse does. Fail the build instead.
      - name: Check the bundle budget
        run: node scripts/check-bundle-size.mjs

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: client
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli autorun --config=./lighthouserc.json

# Render blueprint, free tier.
#
# The free plan has no persistent disk, so the SQLite file is rebuilt on every
# deploy and after the service sleeps. The API re-seeds itself on an empty
# boot, so the demo always works, but accounts made through the UI do not
# survive a redeploy.
#
# To keep real data: set plan to "starter", add a disk, point DATABASE_PATH at
# the mount, and set AUTO_SEED=0.
services:
  - type: web
    name: toolshed-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/toolshed.db
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
